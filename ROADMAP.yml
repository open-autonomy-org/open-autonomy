# The roadmap the agent works, top to bottom, in phase order. `status` is one of
# proposed | planned | active | done, and the agent updates it as it finishes an item.
# The site renders this file as-is. An item looks like:
#
#   - id: short-slug
#     phase: 1
#     priority: high | medium | low
#     status: planned
#     title: One line saying what will be true when it is done
#     acceptance:
#       - A line the agent can verify on the running system.
#
# Empty on purpose: what was built so far is in CHANGELOG.md; what comes next is decided here.
schema: open-autonomy.roadmap.v3
items:
  - id: container-proof
    phase: 1
    priority: high
    status: planned
    title: The containerised agent lands a change through its branch
    acceptance:
      - CHANGELOG.md's Unreleased section carries a line, added by the agent, saying the container landed this item.
      - The item's status is done.
