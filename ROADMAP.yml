# The roadmap the agent works, top to bottom, in phase order. `status` is one of
# proposed | planned | active | done, and the agent updates it as it finishes an item.
# The site renders this file as-is.
#
# Items are about the PRODUCT: template/ and platform/. hermes/ (our own applied template) and world/ (the
# scenarios) are touched only when a product change reaches into them. An item looks like:
#
#   - id: short-slug
#     phase: 1
#     priority: high | medium | low
#     status: planned
#     title: One line saying what will be true when it is done
#     acceptance:
#       - A line the agent can verify on the running system.
#
# Empty on purpose: what was built so far is in CHANGELOG.md; what comes next is decided here.
schema: open-autonomy.roadmap.v3
items:
  - id: stack-attaches-to-world
    phase: 1
    priority: high
    status: proposed
    title: volter-world attach -- docker compose up just works for the agent's containers
    acceptance:
      - "`volter-world attach -- docker compose -f template/container/compose.yml up` brings a cookbook's real stack (gateway + sidecar) up attached to the world: the twins and the platform are reachable from inside the containers, and discord.com reaches the Discord twin. Nothing in this repository exists for the world's sake beyond the compose file; what attach needs to reach containers is developed in volter-world."
      - A run in the attached stack narrates through the production sidecar and delivers its report to the Discord twin, and verify reads both from twin state and the local books.
      - The one-shot agent leg (world/agent.ts) and the world's own sidecar service are gone.
  - id: narration-proof
    phase: 1
    priority: high
    status: done
    title: A run narrated by the agent's own webhooks appears as a receipt with its turns
    acceptance:
      - The world's gate passes with the receipt path exercised end to end (bun world/run.ts check).
      - CHANGELOG.md's Unreleased section names this item as proven by a real run.
  - id: container-proof
    phase: 1
    priority: high
    status: done
    title: The containerised agent lands a change through its branch
    acceptance:
      - CHANGELOG.md's Unreleased section carries a line, added by the agent, saying the container landed this item.
      - The item's status is done.
  - id: world-health-badge
    phase: 1
    priority: high
    status: done
    title: The project page states whether the agent's last run succeeded
    acceptance:
      - A project page served by the worker carries a line naming the outcome of the account's most recent finished run, or says there has been no run yet.
      - The line is rendered from the account's own job receipts, not from any new stored field.
      - Verified in the world - the page fetched from $PLATFORM_URL after a run shows the line - and the platform test suite covers the no-run case.
