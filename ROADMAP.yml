# The roadmap the agent works, top to bottom, in phase order. `status` is one of
# proposed | planned | active | done, and the agent updates it as it finishes an item.
# The site renders this file as-is. What was built before this plan is in CHANGELOG.md.
#
# Open Autonomy is a way to run self-building technologies, in four pieces: the platform (a Patreon-style
# app funding projects with agentic funds, spent through public audited rails, reported through an SDK),
# starter kits (Hermes first: a full boilerplate repo that runs itself out of the box), cookbooks (complete
# autonomous projects worth copying), and this install's own boilerplate — because Open Autonomy is itself an
# Open Autonomy project. The redesign landed greenfield (CHANGELOG.md). This is the rest of v2, in the order
# that completes the system: finish what is in flight, then money in, then the kit, then the cookbooks and
# the agent's own use of the rails, then the operations a platform holding real money owes its patrons.
# Every item is proven in the world before it lands. An item marked `proposed` needs something only the
# owner holds (a Stripe account, a bank, a decision) and says which.
schema: open-autonomy.roadmap.v3
items:
  # ---- Phase 0: landed -------------------------------------------------------------------------------
  - id: live-switch
    phase: 0
    priority: high
    status: done
    title: This install runs on the redesigned product
    acceptance:
      - The redesigned worker is deployed through deploy.yml; the books read the same balances as before the deploy, and the audit trail is intact.
      - This repository's own key is re-minted the adopter way and its stack runs the kit's three containers (agent, key valve, reporter) on this Mac; the schedule fires and its session appears on the project page under the item it worked.

  - id: roadmap-drivers
    phase: 0
    priority: high
    status: done
    title: Roadmaps come from drivers over one normalized model
    acceptance:
      - The platform stores a revisioned, normalized roadmap per project (who, when, diff, public); the yml pull becomes the default driver behind a driver interface that declares conformance for what a tracker cannot express.
      - A second driver (GitHub milestones, credential-free, platform-pulled) proves the interface; a Jira driver runs owner-side and pushes through the SDK on a steer-scoped key, and key scopes split steer from spend before that driver exists.
      - The agent stays tracker-blind - it narrates the item and outcome, and drivers reconcile the native side.

  - id: card-rail
    phase: 0
    priority: medium
    status: done
    title: Agents spend through minted cards
    acceptance:
      - A project's agent can request a single-use card minted against its balance through Stripe Issuing, bounded by an amount and a merchant category the owner set in .open-autonomy/config.yaml; each authorization settles on the books as a `card` rail record with the merchant and amount on the public audit trail.
      - The world proves the flow against a Stripe twin; a refused authorization spends nothing.

  - id: partner-rail
    phase: 0
    priority: medium
    status: done
    title: Agents spend through partner services
    acceptance:
      - A partner service can settle a metered charge against a project's account with the project's key, recorded as a `partner` rail record naming the partner and the unit; the balance hard-stop and the daily rail apply as they do to the model rail.

  - id: docs-from-code
    phase: 0
    priority: medium
    status: done
    title: Every doc names only what exists
    acceptance:
      - A test walks README.md, CLAUDE.md, AGENTS.md and every package README for backticked paths, routes and world verbs and fails on any that the tree, the router or the runner does not have.

  # ---- Phase 1: finish what is in flight -------------------------------------------------------------
  - id: supercode-release
    phase: 1
    priority: high
    status: done
    title: The reporter runs on a released supercode
    acceptance:
      - "`@volter-ai-dev/supercode` publishes a release whose harness list includes hermes and whose session index subscription accepts it (v0.4.18, cut from supercode main with the harness's ACP frontend gated behind its feature)."
      - The kit's reporter dependency names that version; the world no longer builds supercode from a checkout and this install's compose override is gone; the world gate passes on the published binary and this install's reporter publishes a live fire on it.

  # ---- Phase 2: money in — the Patreon half of the platform --------------------------------------------
  - id: polar-checkout
    phase: 2
    priority: high
    status: done
    title: People fund a project on its page through Polar, beside GitHub Sponsors
    acceptance:
      - "Two doors onto the same books, side by side on every tier: GitHub Sponsors (as today) and Polar, the merchant of record for direct patronage. Each project's tiers are Polar products (one-time and monthly) the platform creates and keeps in step; `POST /v1/patrons/checkout {account, tier}` opens a Polar checkout for the project and the page's tiers go through it; a paid order or an active subscription's invoice mints the amount to the account as a `mint` flow carrying the patron's name (never a card), through Polar's signed webhook."
      - Recurring patronage through Polar accrues on its order events, while GitHub Sponsors keep accruing on the monthly cron; the patrons wall and the explore grid count both.
      - Proven in the world against the Polar twin: a checkout confirmed and a renewal order land on the books and the page; a forged webhook does not.

  - id: kit-published
    phase: 3
    priority: high
    status: active
    title: The kit and the SDK install from npm
    acceptance:
      - "`create-open-autonomy` (the kit) and `@open-autonomy/sdk` are published from this repository by a release workflow gated like the deploy; `bun create open-autonomy my-project --account owner/my-project` works on a clean machine with nothing but bun, and the generated repository passes its own check."
      - The kit still vendors the SDK into a generated repository, so a project depends on npm for nothing at runtime; the published SDK is for adapters and other reporters.

  - id: hermes-native-cycle
    phase: 3
    priority: high
    status: done
    title: The agent works the roadmap through Hermes's own development cycle, not a home-made one
    acceptance:
      - "The kit ships no procedure skill. The fire's job files the top open ROADMAP.yml item onto the gateway's Kanban board when no task is open for it and stops; the dispatcher runs it as a worker whose brief is Hermes's own delivery loop (the `github` issue-to-PR discipline with `test-driven-development` and `requesting-code-review` loaded, the project's `AGENTS.md` as the rules); the review lane verifies the handoff independently through `sdlc-review`; a task reaching done sets the item's `status: done` in ROADMAP.yml on the agent's branch, and the landing workflow merges it."
      - "ROADMAP.yml stays the owner's queue and the page's source: the agent never adds an item; `proposed` items await the owner. What the kit adds is know-how, each a small skill usable from any job or a chat: reading and updating the roadmap's status grammar; landing on the agent branch without waiting; operating the project's world as its operator; reporting to patrons in five lines."
      - The reporter publishes the worker's and the reviewer's sessions the way it publishes the run today, each with its cost, filed under the item; the item page shows both lanes.
      - Proven in the world on the cookbook, one item per fire as today, with the review lane's session on the page; and on this repository's own agent.

  - id: agent-side-rails
    phase: 3
    priority: high
    status: active
    title: The agent can spend through the card and partner rails from inside its stack
    acceptance:
      - The key valve forwards `/v1/rails/card` and `/v1/rails/partner` beside the model routes; a rail skill documents when and how to spend through a rail (only for an acceptance line that needs it, within the owner's bounds, naming the purpose), and `.open-autonomy/config.yaml` is where the owner opens each rail.
      - The world proves it from the agent's side: a cookbook item whose acceptance requires a purchase, the scripted model minting a card through the valve and paying the Stripe twin, the capture settling under that item with the merchant on the audit trail and on the item page.

  - id: schedule-pins-model
    phase: 3
    priority: high
    status: done
    title: A model change never strands the schedule
    acceptance:
      - The fire is a script job that spends nothing, so Hermes's drift guard has no model to skip on; a worker takes the model from hermes/config.yaml at dispatch. Any agent job the seed creates is pinned to the config's provider and model and re-pinned on the next boot when the config moved.
      - The world proves it: the cookbook's config changes model between two fires; the first fire's worker spends on the previous model, the second fire's on the new one, and both land.

  - id: skill-stops-when-nothing-queued
    phase: 3
    priority: medium
    status: done
    title: An idle schedule costs almost nothing
    acceptance:
      - The fire reads ROADMAP.yml before anything else and, when no item is active or planned, files nothing and delivers the one-line report; it spends nothing, so a fire on an all-done roadmap costs no model call and publishes no session.

  - id: host-setup-tool
    phase: 3
    priority: medium
    status: active
    title: A project's host is set up by one command
    acceptance:
      - "`bun .open-autonomy/setup.ts` performs container/README.md's host steps idempotently: checks the key file, builds or copies the pinned Hermes image, creates and seeds the two volumes from the repository and its origin, states plainly what it cannot do (the deploy key and its ssh-agent are the owner's) and what to run next; it is what the world's stack step calls, so the two never drift."

  - id: key-rotation-proven
    phase: 3
    priority: medium
    status: active
    title: Keys rotate without a restart, and their expiry is visible
    acceptance:
      - "`GET /v1/keys` on the project's key lists each key's expiry; the reporter and the valve log the key's expiry at start and warn when it is within fourteen days; `bun .open-autonomy/mint-key.ts --rotate` rewrites the host key file and the valve picks it up unrestarted."
      - The world proves it: rotate between two fires; the second fire spends on the new key and the old key is refused after its grace.

  # ---- Phase 4: cookbooks, and the kit proven general ------------------------------------------------
  - id: second-cookbook
    phase: 4
    priority: medium
    status: planned
    title: A second cookbook, not a CLI
    acceptance:
      - "`cookbooks/notes-api`: a small HTTP service (bun, one file, one test file) with a six-item roadmap of one endpoint and one test each, made with the kit plus its own code; its check starts and probes the server."
      - The world walks its first item with the same runner (`--cookbook notes-api`), the todo-cli gate still passes, and the two cookbooks share no scenario code beyond the runner.

  - id: cookbook-through-create
    phase: 4
    priority: medium
    status: active
    title: A cookbook is exactly what the generator makes plus the project's own files
    acceptance:
      - "`bun create open-autonomy` into an empty directory, then the project's own src/test/README/ROADMAP copied in, is byte-identical to the committed cookbook (a test asserts it), so a cookbook can never drift from the kit."

  # ---- Phase 5: operations a platform holding money owes its patrons ----------------------------------
  - id: books-backup
    phase: 5
    priority: high
    status: active
    title: The books can be exported and restored
    acceptance:
      - "`admin.yml → export` writes the books — accounts, flows, coupons, the key registry, the audit trail, sessions, updates, roadmap revisions — as a dated JSON artifact of the workflow run, and a monthly schedule does the same; `POST /admin/import` (admin, reviewed) restores an export into an empty worker."
      - Proven in the world: export, purge the platform's storage, import, and every balance, call record and session reads back the same.

  - id: security-model
    phase: 5
    priority: high
    status: active
    title: The threat model is written down and each claim names its test
    acceptance:
      - SECURITY.md describes v2's trust boundaries (the key valve, the keyless reporter, key scopes, the balance hard-stop and the daily rail, the webhook signatures, the admin path through GitHub, what the agent can read) and, for each claim, names the test or world line that proves it; `scripts/check-docs.ts` verifies the named tests exist.

  - id: readme-for-three-readers
    phase: 5
    priority: low
    status: active
    title: The front page serves the funder, the adopter and the contributor
    acceptance:
      - README.md opens with the four pieces and then three short paths — fund a project (the site), run your own (the kit in three commands), contribute (the world and the check) — each naming only surfaces that exist, verified by the docs check.

  # ---- Phase 6: done ---------------------------------------------------------------------------------
  - id: real-money-live
    phase: 6
    priority: high
    status: proposed
    title: Real money flows on open-autonomy.org
    acceptance:
      - "Owner-gated (identity and a bank, not code): a Polar organization for Open Autonomy and the org's Stripe account with Issuing, their tokens and webhook secrets installed through the admin workflow's secret sync, the webhook endpoints enrolled; everything else is already proven against the twins."
      - One real patronage lands on this project's books through Polar, its payout reaches the org, the Issuing balance is funded from it, and this install's agent makes one real bounded purchase that shows on the audit trail.

  - id: v2-done
    phase: 6
    priority: high
    status: planned
    title: v2 is complete
    acceptance:
      - Every item above is done; the world gate, the root check and the docs check are green on main; the live page shows this install's agent working this roadmap on a released supercode, and real money flows.
