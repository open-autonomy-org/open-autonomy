# The roadmap the agent works, top to bottom, in phase order. `status` is one of
# proposed | planned | active | done, and the agent updates it as it finishes an item.
# The site renders this file as-is. What was built before this plan is in CHANGELOG.md.
#
# This is the redesign punchlist. Open Autonomy is a way to run self-building technologies, in four
# pieces: the platform (a Patreon-style app funding projects with agentic funds, spent through public
# audited rails, reported through an SDK), starter kits (Hermes first: a full boilerplate repo that
# runs itself out of the box), cookbooks (complete autonomous projects worth copying), and this
# install's own boilerplate (our hermes/, the world, these files) — because Open Autonomy is itself
# an Open Autonomy project.
#
# The build runs in two parts. Part one (phases 1-9) builds and proves the core systems — the
# platform cuts, durable keys, the rails seam, the development stream, the SDK, the monorepo, the
# kit generator, the docs — entirely against the world; this repo's own production install keeps
# running as it is and is not touched. Part two (phase 10) applies the finished product to this
# repo as its own autonomy setup. Every item
# lands through the landing convention with `bun run check` and the world's gate green; an item
# needing a maintainer deploy is left `active` with a report, per AGENTS.md.
schema: open-autonomy.roadmap.v3
items:
  - id: four-pieces-framing
    phase: 1
    priority: high
    status: planned
    title: The docs state what Open Autonomy is, in four pieces
    acceptance:
      - README.md and docs/VISION.md lead with the four pieces (platform, starter kits, cookbooks, this install's boilerplate) and describe the platform as a Patreon-style app with spend rails (agent endpoints live; minted cards and partners planned) and an SDK for progress.
      - No doc in the repo claims token usage is the only thing funded, and no doc names a world verb or file that does not exist.
      - AGENTS.md states the same four pieces in its "what this is" line.

  - id: drop-hello-roadmap
    phase: 1
    priority: high
    status: planned
    title: hello-roadmap is gone; todo-cli is the cookbook
    acceptance:
      - cookbook/hello-roadmap and world/handlers/hello-roadmap do not exist; no file in the repo references hello-roadmap.
      - todo-cli is the world's default cookbook, and the world README documents one clock fire of it as the smoke path.
      - "`bun world/run.ts check` passes with the new default."

  - id: remove-run-model
    phase: 2
    priority: high
    status: planned
    title: The per-run token model is gone from the platform
    acceptance:
      - Key claims carry account, allowed models, key id and expiry, and nothing else; the admin per-run mint, per-run status and per-run revoke routes are gone.
      - Grep for issue, actor, purpose, github_run_id, github_run_attempt and github_workflow_ref in platform/src returns nothing.
      - The proxy tests are rebuilt around claim-file keys (mint, spend, audit, rotate) and the suite is green; `bun world/run.ts check` passes.

  - id: remove-lanes
    phase: 2
    priority: high
    status: planned
    title: The ledger bounds spend by balance and the daily rail only
    acceptance:
      - The user and system run lanes, the per-repo, per-actor and per-issue daily counters, the purposes set and the expiry-slot reaping are gone from the ledger; the balance hard-stop, the global daily rail and its admin reset hatch remain, with tests.
      - The nine wrangler vars configuring per-run caps and lanes are gone from wrangler.toml and platform/README.md; the remaining vars match the code's defaults.

  - id: remove-session-capture
    phase: 2
    priority: high
    status: planned
    title: Receipts are the only transcript
    acceptance:
      - The proxy captures nothing from request bodies; the run-session routes, pages and JSON are gone; the secret redactor lives beside the receipts intake and keeps its tests.
      - A narrated run in the world still shows its turns on the project page (receipt path unchanged), verified by the world's gate.

  - id: remove-fleet-health
    phase: 2
    priority: medium
    status: planned
    title: The fleet health monitor is gone
    acceptance:
      - The /health route, the health module, its two env vars, its tests and the last-activity stamping that fed it are gone; /healthz remains.
      - The project page's health line from job receipts still renders, verified in the world.

  - id: site-legacy-cut
    phase: 2
    priority: medium
    status: planned
    title: The site renders funding and receipts, not the old fleet
    acceptance:
      - The live-runs panel, the planner and strategist role labels, issue links, actor handles, GitHub Actions deep links and the session drawer are gone from the rendered pages.
      - The receipts spine, live SSE turns, tiers, patrons, the flow feed and coupon redemption still render, verified against the world's platform.

  - id: platform-residue-sweep
    phase: 2
    priority: medium
    status: planned
    title: Dead residue of older architectures is gone from the platform
    acceptance:
      - The roadmap-issues rollup remnant and its orphaned CSS, the FLEET_ constants, the BACKERS.md perk and every comment or log tag naming the agent-model-proxy or the old fleet are gone.
      - The platform package is named for the platform; the deployed worker name is unchanged, with one comment saying it holds the live books.

  - id: durable-keys
    phase: 3
    priority: high
    status: planned
    title: Keys survive any redeploy
    acceptance:
      - A signed, unexpired key spends with no per-key Durable Object state present; verification is signature plus expiry, with a ledger key registry consulted only for explicit revocation and listing.
      - A platform test proves a key with no registry record still spends and a revoked key does not; admin routes list and revoke keys by id.
      - DEPLOY.md states that rotating AGENT_PROXY_HMAC_SECRET is the one act that invalidates every key, and how to plan a coordinated re-mint.

  - id: retire-run-budget
    phase: 3
    priority: high
    status: planned
    title: The per-run budget object is retired without stranding a key
    acceptance:
      - Only after durable-keys is deployed to production does a migration remove the RunBudget class; no route or module references it.
      - The live standing key keeps spending across that deploy, shown by the account's audit trail continuing without a re-mint.
      - This item needs the maintainer's reviewed deploy; the agent leaves it active with a report naming exactly that step.

  - id: serve-models-route
    phase: 3
    priority: low
    status: planned
    title: The platform serves the models listing
    acceptance:
      - GET /v1/models with a valid key returns the key's allowed models in OpenAI list shape, covered by a test; the sidecar's existing forward of that route now returns 200 in the world.

  - id: spend-rails-seam
    phase: 4
    priority: high
    status: planned
    title: Spending goes through one rails seam on the books
    acceptance:
      - The books expose one internal reserve, settle, release and audit door keyed by account and request id; the model proxy is refactored behind it as the endpoints rail with no route or behavior change.
      - The audit trail rows for a world run are identical in shape before and after, verified by the world's gate.

  - id: stub-rails
    phase: 4
    priority: low
    status: planned
    title: Cards and partners exist as rails on the seam
    acceptance:
      - platform src carries cards and partners rail modules that compile against the seam and serve nothing, each with a README stating what the rail will be (Stripe-minted cards; partner integrations) and what bounds it.
      - The roadmap gains one proposed item per rail with real acceptance lines, awaiting the owner.

  - id: development-stream
    phase: 5
    priority: high
    status: planned
    title: The platform carries the whole development stream, grouped by work item
    acceptance:
      - The receipts model generalizes to sessions - any agent conversation, with a kind, an optional work item, and an optional outcome - so several can be live at once and a conversation without a verdict can simply end; existing scheduled-run receipts are one kind.
      - The platform accepts short progress updates attached to a work item, on the standing key, redacted at intake like turns.
      - A roadmap item's view on the project page shows every session, update and settled cent that touched it, live while a session runs; verified against the world's platform.

  - id: roadmap-schema-codec
    phase: 5
    priority: high
    status: planned
    title: The roadmap model is a published shape in the SDK
    acceptance:
      - The SDK exports the roadmap model as a typed shape with a parser and serializer (YAML in, model out, byte-stable back); the platform's page parses through it.
      - No write API exists; the file in git stays the only roadmap surface, and the SDK README says adapters are what the shape is for.

  - id: sdk-package
    phase: 5
    priority: high
    status: planned
    title: The SDK is wired into the default kit - hermes + supercode + roadmap yml
    acceptance:
      - packages/sdk holds the schema (sessions, turns, updates, work-item association) and a client - open a session, append turns with offset idempotency and resume, close with an optional outcome, post an update, plus the key mint and rotate helpers; the schema exists in exactly one place in the repo.
      - The kit's adapter reads the full session stream from the Hermes home through supercode's session index and follow doors (the transcript source; Hermes's outbound webhooks at most a trigger), publishes it through the SDK, and attaches each session to the roadmap item it serves, read from ROADMAP.yml.
      - Work sessions publish by default with the kit's config naming the private exceptions; the world's gate passes with the receipt path flowing through the SDK, and the SDK README shows the raw wire form of each call so any language can integrate without the package.

  - id: roadmap-drivers
    phase: 5
    priority: high
    status: planned
    title: Roadmaps come from drivers over one normalized model
    acceptance:
      - The platform stores a revisioned, normalized roadmap per project (who, when, diff, public); the yml pull becomes the default driver behind a driver interface that declares conformance for what a tracker cannot express.
      - A second driver (GitHub milestones, credential-free, platform-pulled) proves the interface; a Jira driver runs owner-side and pushes through the SDK on a steer-scoped key, and key scopes split steer from spend before that driver exists.
      - The agent stays tracker-blind - it narrates the item and outcome, and drivers reconcile the native side.

  - id: workspaces-root
    phase: 6
    priority: high
    status: planned
    title: The repo is a workspace monorepo
    acceptance:
      - The root package.json declares apps/* and packages/* workspaces with one root lockfile and a base tsconfig; `bun run check` fans out to every workspace plus the standalone cookbook checks.
      - The supply-chain gate discovers and passes every lockfile.

  - id: platform-to-apps
    phase: 6
    priority: high
    status: planned
    title: The platform lives at apps/platform
    acceptance:
      - The worker builds, tests and deploys from apps/platform; deploy.yml, admin.yml, security.yml, CODEOWNERS, the PR template and world/platform.ts all point at the new path.
      - ci and security are green on the landing branch and `bun world/run.ts check` passes.

  - id: kit-cookbook-paths
    phase: 6
    priority: medium
    status: planned
    title: The kit and cookbooks live at their real paths
    acceptance:
      - template/ is packages/kit-hermes and cookbook/ is cookbooks/ (todo-cli only, outside the workspace); the apply tool, the world's seed, stack and actions, and every doc reference use the new paths.
      - "`bun world/run.ts check` passes from the new layout."

  - id: kit-generator
    phase: 7
    priority: high
    status: planned
    title: The Hermes kit is a cookiecutter generator
    acceptance:
      - "`bun create open-autonomy <dir>` scaffolds a complete repo from parameters (project name, account, model, license) and writes .open-autonomy/kit.json recording kit name, version and parameters - the anchor for check and upgrade."
      - The same tool supports adopt into an existing repo (writes only what is missing), check (regenerate and diff template-owned files) and upgrade (check plus write), each covered by a test.

  - id: extract-boilerplate
    phase: 7
    priority: high
    status: planned
    title: The generated repo is the full boilerplate
    acceptance:
      - A generated repo contains a README with the account's four widgets, ROADMAP.yml, docs/VISION.md, CHANGELOG.md, AGENTS.md, the hermes home, land and ci workflows, the hermes-state gitignore allowlist, a self-contained container directory and a license.
      - A generated repo's own check passes from a bare clone with no reference to this monorepo.

  - id: compose-de-leak
    phase: 7
    priority: medium
    status: planned
    title: The kit's compose file carries nothing install-specific
    acceptance:
      - The twins-checkout mount is gone from the kit's compose and lives in this install's own override; a generated repo's compose names only its own services and volumes.

  - id: cookbook-via-kit
    phase: 7
    priority: medium
    status: planned
    title: todo-cli is provably an instance of the kit
    acceptance:
      - todo-cli's template-owned files are the generator's output for its params, and CI verifies that with the kit's check verb instead of a byte compare against one directory.

  - id: generated-repo-proof
    phase: 7
    priority: high
    status: planned
    title: The world lands an item from a freshly generated repo
    acceptance:
      - A world run seeds a repo scaffolded by the generator (not a committed cookbook), fires the schedule once, and verify passes - the run lands, the receipt narrates, delivery reaches the Discord twin, egress stays sealed.

  - id: honest-tiers
    phase: 8
    priority: low
    status: planned
    title: Every rendered perk is deliverable
    acceptance:
      - The default tiers name only perks a mechanism actually delivers today, and the coupons-stay-admin-only decision is recorded in platform docs.

  - id: docs-from-code
    phase: 9
    priority: high
    status: planned
    title: Every doc describes the repo as it is
    acceptance:
      - Per-package READMEs, the platform API section, DEPLOY.md, SECURITY.md, CONTRIBUTING.md, the bug template and the world README are rewritten from the code; no doc names a route, file, path or cap that does not exist, verified by grepping each named artifact.
      - The world README's coverage section states what is actually covered (Discord delivery is; the ssh deploy-key push path is not).
      - The hermes gitignore block is an allowlist.

  - id: changelog-rewrite
    phase: 9
    priority: medium
    status: planned
    title: The changelog names only things that shipped
    acceptance:
      - CHANGELOG.md is rewritten in the four-pieces vocabulary; every file, tool or route it names exists in history under that name, and the redesign lands as one dated entry.

  - id: apply-kit-to-self
    phase: 10
    priority: high
    status: planned
    title: This repo runs its own autonomy setup from the finished kit
    acceptance:
      - Our hermes home, landing workflows and ignore rules are the kit's adopt output, with .open-autonomy/kit.json recording the parameters and every deliberate divergence; the kit's check passes on this repo in CI.
      - The production agent keeps landing roadmap items through the regenerated setup, shown by the next item it finishes after the switch.

  - id: self-development-stream
    phase: 10
    priority: high
    status: planned
    title: This repo's own development streams to its page
    acceptance:
      - Our install's adapter reads the full session stream from our Hermes home through supercode and publishes it through the SDK on the production key, work sessions by default with config naming the private exceptions.
      - The project page at open-autonomy.org shows our sessions and updates attached to the roadmap items they serve, live while a session runs.
