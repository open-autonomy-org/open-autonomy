# The roadmap the agent works, top to bottom, in phase order. `status` is one of
# proposed | planned | active | done, and the agent updates it as it finishes an item.
# The site renders this file as-is.
schema: open-autonomy.roadmap.v3
items:
  - id: fund-and-show
    phase: 1
    priority: high
    status: done
    title: Fund the project and show its vision and roadmap
    acceptance:
      - The site's project page renders docs/VISION.md and ROADMAP.yml from this repository.
      - Sponsor money enters the project's account and every model call is metered against it.
      - The README funding widget shows the live balance and runway.
  - id: hermes-self-builder
    phase: 1
    priority: high
    status: active
    title: The project's own Hermes agent builds the roadmap
    acceptance:
      - hermes/ is a complete Hermes home (config, SOUL.md, skills, cron) checked into the repository.
      - The agent's model calls go through the platform on a standing project key and appear in the books.
      - A cron job works the top open roadmap item, runs the checks, and pushes to main.
  - id: token-only-books
    phase: 2
    priority: high
    status: planned
    title: Only token usage on the books
    acceptance:
      - The platform meters model calls and nothing else; the generic supplier debit API is removed.
      - The public account snapshot reconciles to model spend alone.
  - id: per-call-audit
    phase: 2
    priority: high
    status: planned
    title: Durable per-call audit log per account
    acceptance:
      - Every metered call is appended to a durable log keyed by account (model, tokens, cost, time, run).
      - A public read route serves the log so a sponsor can audit where funding went.
  - id: readme-widgets
    phase: 2
    priority: medium
    status: planned
    title: README widget family
    acceptance:
      - Camo-safe SVGs for funding, roadmap progress, and recent activity, embedded in the README.
      - Each widget renders from the same data the site shows.
  - id: hermes-live-view
    phase: 3
    priority: medium
    status: proposed
    title: Show what the agent is doing now
    acceptance:
      - The site renders the agent's current session, its schedule, and its setup from hermes/ and the proxy.
      - Visualization only; nothing on the site drives the agent.
