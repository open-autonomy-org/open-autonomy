# The project agent's Hermes configuration. The model is this project's choice (runtime config, seeded by
# the kit, never checked by it). Secrets live in hermes/.env (git-ignored):
#   OPEN_AUTONOMY_BASE_URL / OPEN_AUTONOMY_KEY  — inside the stack, the key valve's address and a dummy
#   DISCORD_BOT_TOKEN / DISCORD_HOME_CHANNEL    — optional Discord delivery
# Our own agent's model runs on the owner's Codex subscription, held by the valve (secrets/codex.json). The platform
# key still carries its narration and its rails. The cookbooks and the world stay on the platform's model rail.
model:
  default: gpt-5.6-sol
  provider: codex-valve
# The valve's third port, speaking the Codex protocol: the start script writes HERMES_CODEX_BASE_URL into the home's
# .env when secrets/codex.json exists. A named custom provider, so Hermes's scheduler runs the PM on it too.
custom_providers:
  - name: codex-valve
    base_url: ${HERMES_CODEX_BASE_URL}
    api_key: valve
    api_mode: codex_responses

terminal:
  backend: local
  # Native API helpers use Hermes Python in the managed container; absent files are skipped.
  shell_init_files: [/opt/hermes/.venv/bin/activate]
  timeout: 300

# Everything the agent is must be readable in the repository, so it carries no private memory between runs.
memory:
  memory_enabled: false
  user_profile_enabled: false

compression:
  enabled: true
  threshold: 0.50

agent:
  max_turns: 160

# The board (Hermes Kanban) the schedule files roadmap items on. Its dispatcher runs inside the gateway and
# the review lane verifies every handoff; the interval is how soon a filed task is picked up.
kanban:
  dispatch_interval_seconds: 15
  review_dispatch: true

# Discord conversation tools are opt-in even when the gateway is connected.
platform_toolsets:
  discord: [hermes-discord]

# Verified identities and delegation live in skills/project-communications/SKILL.md.
# Native command access is separate from the public guild participation gate.
discord:
  server_actions: [list_guilds, server_info, list_channels, channel_info, list_roles, member_info, search_members, fetch_messages, create_thread]
  group_allow_admin_from: ["605505624226136074"]
  group_user_allowed_commands: []
  channel_skill_bindings:
    - id: "1544906155422257215" # general
      skills: [project-communications]
    - id: "1546378794057728021" # help; forum posts inherit this binding
      skills: [project-communications]
    - id: "1546378402280382565" # development
      skills: [project-communications]
    - id: "1546379008697172019" # announcements
      skills: [project-communications]
