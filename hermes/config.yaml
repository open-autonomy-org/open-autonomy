# The Open Autonomy agent's Hermes configuration. Secrets live in hermes/.env (git-ignored):
#   OPEN_AUTONOMY_BASE_URL / OPEN_AUTONOMY_KEY  — the standing project key (platform/scripts/hermes-key.ts)
#   DISCORD_BOT_TOKEN / DISCORD_ALLOWED_USERS    — optional Discord gateway
model:
  default: deepseek/deepseek-v4-flash
  provider: custom
  base_url: ${OPEN_AUTONOMY_BASE_URL}
  api_key: ${OPEN_AUTONOMY_KEY}
  api_mode: chat_completions

terminal:
  backend: local
  timeout: 300

# Everything the agent is must be readable in the repository, so it carries no private memory between runs.
memory:
  memory_enabled: false
  user_profile_enabled: false

compression:
  enabled: true
  threshold: 0.50

agent:
  max_turns: 80

# The agent narrates its scheduled runs to the platform by pushing Hermes's own lifecycle events to the key
# sidecar beside it, which translates them into the platform's receipts on the standing key (the agent holds
# no credential). The site's NOW and DONE bands are those receipts. Visualization only; nothing here drives
# the agent. See hermes/README.md.
hooks:
  outbound:
    - name: open-autonomy-receipts
      url: ${OPEN_AUTONOMY_NARRATE_URL}
      events: [on_session_start, post_llm_call, post_tool_call, on_session_end]
      timeout: 10
