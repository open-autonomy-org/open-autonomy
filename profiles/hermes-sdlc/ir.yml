# hermes-sdlc — simple-sdlc translated for a NATIVE Hermes substrate.
#
# "Native" means: Hermes is not activated as a shell an agent is launched into. Hermes' own kanban kernel
# IS the board (claim_task / heartbeat_claim / release_stale_claims / reclaim_task / enforce_max_runtime),
# its swarm workers ARE the launched sessions (SwarmWorkerSpec {profile,title,body,skills,priority,
# max_runtime_seconds}), and its residents are long-lived conversations engaged through the gateway.
#
# Three differences from simple-sdlc, and each one is a claim this profile has to survive at runtime, not a
# preference (see the twin repo's `cookbook/hermes-sdlc/run.ts` — the sealed-world run that tries to break
# each of them; `scenarios/hermes-sdlc/README.md` is this repo's pointer to it):
#
#   1. A CLAIM IS A LEASE, NOT A HANDLE. Hermes heartbeats a claim and reclaims it when the heartbeat stops.
#      So the same work item can be legitimately launched TWICE — once by the PM, once by the kernel after a
#      reclaim — and the two runs can overlap for as long as the reclaim window. simple-sdlc's `develop`
#      runs in the SHARED checkout; two overlapping developers there corrupt each other. Here `develop` and
#      `review` declare `execution: { workspace: isolated }`, which is the portable IR way to say "every
#      launch gets its own workspace" (docs/SPEC.md#the-runner). This is the ONE structural change.
#
#   2. DONE IS VERIFIED, NOT PRESUMED. A Hermes worker's process exit tells you nothing about whether the
#      work happened — the kernel marks a card done when the worker returns, and a worker that fell over
#      mid-turn returns just the same. (Observed, not feared: a `develop` worker that produced nothing drove
#      its card to `done`.) Hermes' own answer is `goal_mode`, whose judge is an auxiliary LLM re-reading the
#      card — a model grading its own homework, which is the presumption this profile exists to reject.
#      TWO mechanisms replace it, and they are different layers. Both workers that can change the board
#      declare a typed `result` envelope, so a routing decision is made from a VALIDATED value rather than an
#      exit code; and `ztrack` — kept, not dropped — is the DETERMINISTIC oracle underneath it: a checked
#      acceptance criterion must cite a commit SHA that exists in git. substrate-hermes installs that oracle
#      as a Hermes `pre_tool_call` hook that REFUSES `kanban_complete` until `ztrack check` is green, so
#      "done" is unreachable rather than merely discouraged.
#
#      The two planes stay separate on purpose. Kanban owns DISPATCH (board, WIP, leases, worktrees); ztrack
#      owns VERIFICATION (issues, ACs, commit-backed proof). A card is a RUN OF an issue, never the issue
#      itself — which is why kanban.db is disposable and `.volter/tracker/` is not. They meet in exactly two
#      thin places: a branch name (`kanban create --branch <issue>`, which `ztrack check --auto-scope`
#      resolves from) and an exit code. Neither reads the other's storage.
#
#   3. THE HUMAN IS ENGAGED, NOT LAUNCHED. Hermes' gateway (Slack/Discord/...) is a messaging channel, and a
#      person on the other end of it is not a session anyone can start, watch, or cancel. `maintainer` is
#      `kind: human`: no substrate ever launches a job for it — the runner PARKS the ask and the flow resumes
#      only on a verified resolution (docs/SPEC.md#handoffs, profiles/hello-human is the minimal precedent).
#
#   4. THE PM ORCHESTRATES BUT DOES NOT SCHEDULE. See the `pm` block below. It still decides what ENTERS
#      the board and reads what is in flight (`agent:launch` + `agent:list`); the kernel decides when each
#      card runs, so a pm that also schedules is a second dispatcher racing the first. "Not the scheduler"
#      is not "not the orchestrator" — a pass of mine collapsed the two and stripped capabilities the pm's
#      own skill exercises, which made this file UNDER-state its authority. Under-stating is as wrong as
#      over-stating: `capabilities` is the authority statement the `audit` actor reads.
#
# A RETRACTION. An earlier version of this header said Hermes' card dependency links (`link`) were "NOT
# translated, deliberately", on the grounds that "a dependency edge the kernel enforces would be a second,
# invisible scheduler". That had it exactly backwards: the KERNEL is the first scheduler, and it was the pm
# that was the second one. Links are now how `develop.review` is realized — the substrate opens the review
# card as a linked CHILD of the proposal card, so `recompute_ready` promotes it precisely when the proposal
# reaches done. That makes the merge boundary structural instead of something a model has to remember, which
# is what the `review:` edge is FOR. Issue-level dependencies stay in ztrack; `--parent` is used only for
# this within-item sequencing, so there is still exactly one dependency graph per question.
schema: autonomy.ir.v1
# This is what packages/substrate-hermes compiles: every actor becomes a Hermes profile whose SOUL.md is
# that actor's SKILL.md verbatim, `maintainer` deliberately becomes no profile at all, and the kanban
# kernel is the board. It stays PR-free (review = the reviewer's verdict over commit-evidence).
#
# HERMES ONLY, and this narrowed from `[local, hermes]` once the doctrine actually became native.
# Two independent reasons, either of which is sufficient:
#   - Both substrates emit `scripts/runner.ts` (the Runner frontend) with DIFFERENT contents, so compiling
#     this profile both ways into one repository leaves whichever ran last, silently. `compileHermes`
#     refuses the pair outright now rather than letting that race decide.
#   - The skills below are no longer substrate-neutral. They tell a worker that the KERNEL enforces
#     concurrency, that the reviewer is dispatched into the proposal's worktree after the developer
#     finishes, and that `--branch` is refused because the runner names branches. Every one of those is
#     false on `local`, whose runner has no kernel and takes `--branch` from the PM. Compiling this to
#     `local` would install confident, wrong doctrine — the silent class this profile exists to kill.
# `simple-sdlc` remains the local-substrate profile; this one is its Hermes-native sibling.
targets: [hermes]
codeHost: local-git

agents:
  # STILL THE ORCHESTRATOR — but NOT the scheduler, and separating those two is the one structural
  # difference from simple-sdlc's pm.
  #
  # simple-sdlc's pm is both, because the `local` substrate has no kernel: something must sweep the board,
  # enforce WIP, and stop a superseded worker. Hermes HAS a kernel and already does every one of those jobs
  # — `recompute_ready` (eligibility), `max_in_progress` (WIP), claim leases + `release_stale_claims`
  # (liveness), `enforce_max_runtime` (timeout), `reclaim_task` (cancel). A pm that re-implements them is a
  # SECOND dispatcher racing the first, which is the pattern Hermes itself deprecated: `kanban daemon` is
  # marked "DEPRECATED — dispatcher now runs in the gateway", with its escape hatch hidden from `--help`
  # specifically so nobody "keeps the old double-dispatcher pattern alive".
  #
  # What survives that subtraction is still orchestration, and an earlier pass of mine wrongly stripped it:
  # the pm decides what ENTERS the board (`agent:launch` — reading the TRACKER for newly-actionable issues,
  # applying the risk/allowlist/deferral fences no kernel has an opinion about, and filing one card per
  # eligible issue) and READS what is in flight to decide (`agent:list`). Its own skill runs
  # `runner.ts launch` and `runner.ts list`, so declaring less than that made the IR UNDER-state its
  # authority — which the audit actor reads, and which is exactly as wrong as over-stating it.
  #
  # `agent:cancel` is genuinely gone, and that part of the subtraction stands: rework is re-filing (the
  # launch is idempotent per issue), so the pm never reclaims a run. Killing a worker is the kernel's job.
  #
  # NOTE what `agent:list` costs: Hermes reserves `kanban_list` for ORCHESTRATOR sessions
  # (`_check_kanban_orchestrator_mode`, gated on HERMES_KANBAN_TASK being absent), so it lowers only for a
  # STANDING actor. The cron trigger below is what earns that seat — it is an intake poll, not a scheduler
  # tick, and it is also the thing that makes this capability lower at all.
  pm:
    behavior: pm
    capabilities: [agent:launch, agent:list, tasks:author, tasks:converse]
    triggers:
      - cron: "*/15 * * * *"

  # Turns an untriaged request into a verifiable Ready issue. Unchanged from simple-sdlc: drafting touches
  # the tracker, never the working tree, so a duplicate launch needs no isolation.
  draft:
    behavior: draft
    capabilities: [tasks:author, tasks:converse]
    triggers:
      - dispatch: true
        params: { ZTRACK_ISSUE: subject.ref }

  # Implements exactly one Ready issue and produces real evidence for each AC.
  # `workspace: isolated` — claim #1 above. `result` — claim #2: the PM routes on this envelope, not on exit.
  # `review: review` — the merge boundary's wiring edge: requesting review is mechanical, so the substrate
  # triggers the reviewer when the proposal lands rather than trusting a model to remember.
  develop:
    behavior: develop
    capabilities: [code:propose, tasks:converse]
    execution: { workspace: isolated }
    review: review
    result:
      schema:
        $id: hermes-sdlc.develop.v1
        type: object
        additionalProperties: false
        required: [schema, ref, headSha, outcome, evidence]
        properties:
          schema: { const: hermes-sdlc.develop.v1 }
          ref: { type: string, minLength: 1, maxLength: 200 }
          headSha: { type: string, pattern: "^[0-9a-fA-F]{40}$" }
          outcome: { enum: [proposed, blocked, human-required] }
          # One entry per acceptance criterion, each citing where the proof lives. An empty array is
          # legal ONLY for a non-`proposed` outcome — see the allOf below.
          evidence:
            type: array
            maxItems: 50
            items:
              type: object
              additionalProperties: false
              required: [ac, proof]
              properties:
                ac: { type: string, minLength: 1, maxLength: 2000 }
                proof: { type: string, minLength: 1, maxLength: 2000 }
          blockedReason: { type: string, minLength: 1, maxLength: 2000 }
        allOf:
          # A proposal with no evidence is the exact failure mode #2 exists to catch: a worker that exited
          # cleanly having done nothing. Reject it at the envelope, before it reaches the PM.
          - if: { properties: { outcome: { const: proposed } }, required: [outcome] }
            then: { properties: { evidence: { minItems: 1 } } }
          - if: { properties: { outcome: { const: blocked } }, required: [outcome] }
            then: { required: [blockedReason] }
    triggers:
      - dispatch: true
        params: { ZTRACK_ISSUE: subject.ref }

  # Verifies one In-Review change and moves it to Done or back for rework.
  # `workspace: shared` — a deliberate CHANGE from simple-sdlc, forced by how the review edge is realized
  # here. `develop.review` becomes a linked CHILD CARD (substrate-hermes' `openReviewCard`), and the
  # proposal's card owns a worktree on a branch named for the issue. Git refuses to check out one branch in
  # two worktrees, so an isolated reviewer could not be placed on the branch it must review — and a failed
  # workspace resolution auto-blocks the card. A reviewer reads COMMITTED history (`git log <issue-branch>`,
  # `git show <sha>`), and a worktree shares its repo's object store, so the ordinary checkout can see every
  # proposal commit. The isolation that matters for correctness — nobody mutating the proposal while it is
  # read — is already provided by the proposal's own worktree.
  # A LIVE RUN corrected what `shared` must LOWER to, which is a substrate fact rather than a profile one:
  # it is Hermes `dir:<repo>` (the checkout itself), never `scratch` (a fresh EMPTY dir under the board root).
  # The first reviewer to run was dispatched into a scratch dir with no repo in it, had to hunt for the
  # checkout by path, and got exit 127 from `ztrack check` because the ztrack shim resolves
  # `node_modules/.bin/ztrack` by walking UP from cwd. See substrate-hermes' `hermesWorkspace`.
  # The result schema is the STANDARD one (open-autonomy.review.v1) because `develop.review` names this agent
  # and the spec requires the bound reviewer to speak the standard contract — the reviewer's verdict is the
  # merge gate, so its shape is not a per-profile choice.
  review:
    behavior: review
    capabilities: [code:review, tasks:converse]
    execution: { workspace: shared }
    result: { schema: open-autonomy.review.v1 }
    triggers:
      - dispatch: true
        params: { ZTRACK_ISSUE: subject.ref }

  # The human seam. A person, engaged through Hermes' gateway; never a launched session. Reached when the
  # reviewer returns `outcome: human-required` (which the standard envelope requires to carry a `humanTask`
  # naming the ask, the assignee, and the completion condition) or when a change touches a
  # `policy.box.risk.human_required_paths` entry.
  maintainer:
    kind: human
    behavior: maintainer
    capabilities: [tasks:converse, code:review]
    triggers:
      - dispatch: true
        params: { ZTRACK_ISSUE: subject.ref }

  # Conformance auditor of THIS INSTALL — byte-identical doctrine to simple-sdlc's (bin/check-profiles.ts's
  # SHARED_SKILLS guard enforces that), so this block is a verbatim carry and must stay one.
  audit:
    behavior: audit
    capabilities: [tasks:converse, code:propose@docs/audits]
    triggers:
      - dispatch: true
        params: { TARGET_REF: subject.ref }
      - cron: "51 9 * * 0"

policy:
  maxConcurrent: 2
  box:
    tracker:
      # Kept explicitly on the fork (BL-29): the directory basename is `hermes-sdlc`, and there is no ztrack
      # preset by that name. Without this key the CLI would fall back to the basename and silently select a
      # preset that does not exist. The process is simple-sdlc's, so the preset is too.
      ztrackPreset: simple-sdlc
    risk:
      human_required_paths:
        - .github/workflows/**
        - .agents/skills/**
        - .claude/skills/**
        - profiles/**/skills/**
        - profiles/**/scheduler/**
        - .volter/tracker/validation/**
    dispatch:
      mode: allowlist
      allow_label: oa-approved

resources:
  - .claude/settings.json
  - .codex/hooks.json
  - standards/workflow.md
  - standards/issue-and-evidence.md
  - standards/risk-and-review.md
