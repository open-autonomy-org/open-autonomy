name: Security
# Scans the workflows (zizmor) and the platform lockfile (integrity + audit) on push to main, PRs,
# and weekly.
on:
  push:
    branches: [main, 'agent/**', 'land/**'] # branch pushes get their checks on the head commit, which auto-merge requires
  pull_request:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    # A branch in this repository is checked on its push; the pull_request run would be a duplicate of the
    # same commit. A fork's pull request has no push here, so that is the run that checks it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Supply-chain (lockfile integrity + bun audit)
        run: bun platform/scripts/check-supply-chain.ts
      - name: Workflow static analysis (zizmor)
        run: pipx run zizmor==1.26.1 --offline --min-severity high .github/workflows/
