name: Ship
# One standing pull request from `main` to `prod`: what the owner ships. It grows as `main` moves, so changes compound
# until the owner reads the whole diff and merges it; the merge deploys the platform and publishes every new package
# version (deploy.yml, release.yml). Only an org admin may merge it (the `prod` ruleset); nothing here merges it.
# Merges to main are made by the landing workflow's token, and GitHub starts no workflow from those pushes, so this runs
# on a schedule (and by hand): the pull request follows main by itself once open, and is reopened after each ship.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the pull request open
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          open=$(gh pr list -R "$REPO" --base prod --head main --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then echo "pull request #$open ships main to prod"; exit 0; fi
          ahead=$(gh api "repos/$REPO/compare/prod...main" --jq .ahead_by)
          if [ "$ahead" = 0 ]; then echo "prod has everything on main; nothing to ship"; exit 0; fi
          gh pr create -R "$REPO" --base prod --head main --title "Ship to production" \
            --body "Merging ships \`main\` to production: the platform deploys and every package version not yet on npm is published. Read the whole diff first; money and auth changes are the owner's to read. Merge with a merge commit."
