name: Publish docs
# The project's docs (docs/) on GitHub Pages, once its team sets the repository's Pages source to "GitHub Actions"
# (hermes/skills/open-autonomy/front-door). A publish, never a gate: nothing waits on it. A merge that auto-merge makes
# with the workflow token starts no workflow, so an hourly run publishes what such merges landed; a person's merge
# publishes at once. Until Pages is set to Actions, or while there is no docs/index, a run stops at the check: no
# build, and no deployment recorded. In a private repository each hourly check bills Actions minutes; its team may
# thin the schedule.
on:
  push:
    branches: [main]
    paths: ['docs/**']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
# Each job holds only what it uses: the check and the build read Pages' settings, and only the deploy writes to Pages
# and mints the token it proves itself with.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${{ github.repository }}/pages" -q .build_type 2>/dev/null || true)
          if [ "$source" = workflow ] && { [ -f docs/index.md ] || [ -f docs/index.html ]; }; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          else
            echo "publish=no" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: check
    if: needs.check.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
