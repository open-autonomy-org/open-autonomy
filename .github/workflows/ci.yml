name: CI
on:
  push:
    branches: [main, 'agent/**', 'land/**'] # branch pushes get their checks on the head commit, which auto-merge requires
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # A branch in this repository is checked on its push; the pull_request run would be a duplicate of the
    # same commit. A fork's pull request has no push here, so that is the run that checks it. The org's
    # approval policy for pull-request workflows is "first-time contributors who are new to GitHub": the
    # landing workflow's bot opens our pull requests, and any stricter setting parks its runs on an approval
    # nobody gives, which expires as a red run beside the green one that counted.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun run check
