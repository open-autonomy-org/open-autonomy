name: Release the SDK and the kit
# Publishes @open-autonomy/sdk, @open-autonomy/backend and create-open-autonomy to npm, gated like the deploy: a human-cut
# `release-v<kit version>` tag (only an org admin can cut one), and the `production` environment's required
# reviewer approves each run. The tag names the version both packages carry; a mismatch stops before publishing.
# Egress is locked to npm, so the publish token cannot leave to any other host. The world proves the same
# publish against the npm registry twin (bun world/run.ts kit) before any release is cut.
on:
  push:
    tags: ['release-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Lock down egress (the publish token must not leave to a non-npm host)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
          no-cache: true # no restored cache can poison a privileged publish
      - name: Install (frozen)
        run: bun install --frozen-lockfile
      - name: The tag names the kit's version (the SDK publishes whenever its own version is new)
        if: startsWith(github.ref, 'refs/tags/release-v')
        run: |
          tag="${GITHUB_REF#refs/tags/release-v}"
          v=$(bun -e "console.log(require('./packages/kit-hermes/package.json').version)")
          [ "$v" = "$tag" ] || { echo "the kit is $v, the tag says $tag"; exit 1; }
      - name: Publish (the SDK first; the kit and the CLI depend on it)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NPM_TOKEN" ] || { echo "NPM_TOKEN is not installed in the production environment"; exit 1; }
          # The token where bun looks for it: the home's .npmrc, each package's .npmrc, and the environment.
          rc=$(printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN")
          printf '%s\n' "$rc" > "$HOME/.npmrc"
          for p in packages/sdk packages/backend packages/kit-hermes packages/cli; do printf '%s\n' "$rc" > "$p/.npmrc"; done
          export NPM_CONFIG_TOKEN="$NPM_TOKEN"
          echo "home: $HOME; npmrc: $(wc -c < "$HOME/.npmrc") bytes; whoami: $(cd packages/sdk && bun pm whoami 2>&1 | tail -1)"
          # A version already on the registry is not published again (a rerun after a partial release), and an
          # unpublished one that fails, fails loudly.
          for p in packages/sdk packages/backend packages/kit-hermes packages/cli; do
            name=$(bun -e "console.log(require('./$p/package.json').name)"); v=$(bun -e "console.log(require('./$p/package.json').version)")
            if npm view "$name@$v" version >/dev/null 2>&1; then echo "$name@$v is already on the registry"; continue; fi
            # A workspace dependency is pinned to the version in this checkout, here, not left to the publisher's
            # substitution: create-open-autonomy vendors the SDK it was built with into every project it makes, and a
            # stale pin ships a client that cannot read what the project needs.
            bun -e '
              const fs = require("fs");
              const p = process.argv[1] + "/package.json", m = JSON.parse(fs.readFileSync(p, "utf8"));
              for (const field of ["dependencies", "devDependencies", "peerDependencies"]) {
                for (const [name, range] of Object.entries(m[field] ?? {})) {
                  if (typeof range !== "string" || !range.startsWith("workspace:")) continue;
                  const dir = name.replace("@open-autonomy/", "packages/");
                  const v = JSON.parse(fs.readFileSync(dir + "/package.json", "utf8")).version;
                  m[field][name] = v; console.log(`pinned ${name} ${range} -> ${v}`);
                }
              }
              fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
            ' "$p"
            (cd "$p" && bun publish --access public --registry https://registry.npmjs.org/)
          done
  # The repository's own front door: a GitHub release for what npm now serves, so its Releases page and "Latest" say the
  # version people install. Its own job, after the publish: the write permission is this job's alone, and the npm token
  # never enters it.
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/release-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Lock down egress (GitHub's API only)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - name: Release the tag on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          v="${TAG#release-v}"
          notes=$(printf 'Published to npm: [create-open-autonomy@%s](https://www.npmjs.com/package/create-open-autonomy/v/%s).\n\nStart a project: `bun create open-autonomy <dir>`. What changed: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).' "$v" "$v" "$REPO" "$TAG")
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub release"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --latest --title "Open Autonomy kit $v" --notes "$notes"
          fi
