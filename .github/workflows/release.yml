name: Release the SDK and the kit
# Publishes @open-autonomy/sdk and create-open-autonomy to npm, gated like the deploy: a human-cut
# `release-v*` tag (agents cannot push tags) or a manual dispatch, and the `production` environment's required
# reviewer approves each run. The tag names the version both packages carry; a mismatch stops before publishing.
# Egress is locked to npm, so the publish token cannot leave to any other host. The world proves the same
# publish against the npm registry twin (bun world/run.ts kit) before any release is cut.
on:
  push:
    tags: ['release-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Lock down egress (the publish token must not leave to a non-npm host)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
          no-cache: true # no restored cache can poison a privileged publish
      - name: Install (frozen)
        run: bun install --frozen-lockfile
      - name: The tag names the version both packages carry
        if: startsWith(github.ref, 'refs/tags/release-v')
        run: |
          tag="${GITHUB_REF#refs/tags/release-v}"
          for p in packages/sdk packages/kit-hermes; do
            v=$(bun -e "console.log(require('./$p/package.json').version)")
            [ "$v" = "$tag" ] || { echo "$p is $v, the tag says $tag"; exit 1; }
          done
      - name: Publish (the SDK first; the kit depends on it)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NPM_TOKEN" ] || { echo "NPM_TOKEN is not installed in the production environment"; exit 1; }
          # bun takes the token on its own flag; it does not read an _authToken line for registry.npmjs.org.
          (cd packages/sdk && bun publish --access public --token "$NPM_TOKEN")
          (cd packages/kit-hermes && bun publish --access public --token "$NPM_TOKEN")
