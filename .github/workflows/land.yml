name: Land a branch
# Nothing pushes to `main`: independent approval of the current PR head is required, with no bypass.
# Pushing a branch opens its PR and arms native auto-merge; repository rules enforce review and any
# required static checks. Human approval is reserved for release.
#   agent/**  the agent's own work        land/**  a maintainer's
on:
  push:
    branches: ['agent/**', 'land/**']
permissions:
  contents: write
  pull-requests: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Open the pull request once, then arm auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create -R "$REPO" --base main --head "$BRANCH" --title "$BRANCH" \
              --body "Opened by the landing workflow for \`$BRANCH\`. It merges automatically after independent agent approval and required static checks."
            existing=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          fi
          gh pr merge -R "$REPO" "$existing" --merge --auto
          echo "pull request #$existing: auto-merge armed; required approval gates landing"
