name: Land a branch
# Nothing pushes to `main`: a branch lands through its pull request. Pushing a branch opens that PR; the
# change's independent review judges its current head, and the author merges it once that review passes.
# Nothing merges it automatically, and no rule waits on an approval. Human approval is reserved for release.
#   agent/**  the agent's own work        land/**  a maintainer's
on:
  push:
    branches: ['agent/**', 'land/**']
permissions:
  contents: write
  pull-requests: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Open the pull request once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing=$(gh pr list -R "$REPO" --base main --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create -R "$REPO" --base main --head "$BRANCH" --title "$BRANCH" \
              --body "Opened by the landing workflow for \`$BRANCH\`. Its author merges it after an independent review of its current head passes."
            existing=$(gh pr list -R "$REPO" --base main --head "$BRANCH" --state open --json number -q '.[0].number')
          fi
          echo "pull request #$existing: open; its author merges it after its independent review passes"
