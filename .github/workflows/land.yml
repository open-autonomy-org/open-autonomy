name: Land an agent branch
# The agent pushes its work to `agent/<item>` with a repository-scoped deploy key: it cannot open a pull
# request or touch main. This workflow does the GitHub part for it: open the pull request (once) and arm
# native auto-merge, so the branch lands on main exactly when the required `ci` and `security` checks
# pass on its head commit (ci.yml and security.yml also run on `agent/**` pushes for that reason) and
# never otherwise. No agent can merge; no red commit lands.
on:
  push:
    branches: ['agent/**']
permissions:
  contents: write
  pull-requests: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Open the pull request once, then arm auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            title=$(git -C . log -1 --format=%s 2>/dev/null || echo "$BRANCH")
            gh pr create -R "$REPO" --base main --head "$BRANCH" --title "${title:-$BRANCH}" \
              --body "Opened by the landing workflow for the agent's branch \`$BRANCH\`. It merges on its own when the required checks pass."
            existing=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          fi
          gh pr merge -R "$REPO" "$existing" --auto --merge
          echo "pull request #$existing: auto-merge armed"
