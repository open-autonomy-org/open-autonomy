# This install's additions to the kit's stack (container/compose.yml is the kit's, untouched): the reporter's
# supercode. Its Hermes harness is on supercode's main branch and not yet in a published release, so this
# install runs a build from the checkout beside this repository (the world builds it into
# .volter/supercode-build). Retire this file when a release carries the harness (ROADMAP: supercode-release).
#
#   AGENT_SECRETS=~/.config/open-autonomy docker compose -f container/compose.yml -f container/compose.override.yml up -d --build
services:
  reporter:
    environment:
      - SUPERCODE_BIN=/opt/local/supercode
    volumes:
      - ${SUPERCODE_BUILD:-../.volter/supercode-build}/supercode:/opt/local/supercode:ro
