# The Open Autonomy agent, as it runs: three containers in one VM-native world.
#   agent    stock Hermes (gateway = the Discord channel + the cron schedule) with the checkout it works
#   sidecar  holds the project's standing key and forwards the model routes (and the reporter's events)
#   reporter narrates runs to the platform through supercode's harness protocol, reading the agent's home
# Nothing the agent can read is a secret that matters (hermes/README.md). The home and the checkout live
# in Docker volumes: SQLite over a host bind mount is a bus error waiting to happen, and nothing on the
# host needs them — inspect with `docker exec`.
#
#   AGENT_SECRETS=~/.config/open-autonomy docker compose -f container/compose.yml up -d --build
services:
  sidecar:
    image: oven/bun:1.3.10
    container_name: oa-sidecar
    restart: unless-stopped
    command: ["bun", "/sidecar/agent-sidecar.ts"]
    environment:
      - AGENT_ENV_FILE=/secrets/agent.env
    volumes:
      - ../platform/scripts/agent-sidecar.ts:/sidecar/agent-sidecar.ts:ro
      - ${AGENT_SECRETS:-~/.config/open-autonomy}/agent.env:/secrets/agent.env:ro
    networks: [agent]
  agent:
    build: .
    image: open-autonomy-agent:local
    container_name: oa-agent
    restart: unless-stopped
    depends_on: [sidecar]
    command: ["gateway", "run"]
    environment:
      # The host user's ids: the forwarded ssh-agent socket is theirs.
      - HERMES_UID=${AGENT_UID:-501}
      - HERMES_GID=${AGENT_GID:-20}
      - SSH_AUTH_SOCK=/ssh-agent
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=accept-new
    volumes:
      - oa-home:/opt/data
      - oa-repo:/work/open-autonomy
      - /run/host-services/ssh-auth.sock:/ssh-agent
    networks: [agent]
  reporter:
    build:
      context: .
      dockerfile: Dockerfile.reporter
    image: open-autonomy-reporter:local
    container_name: oa-reporter
    restart: unless-stopped
    depends_on: [sidecar, agent]
    user: "${AGENT_UID:-501}:${AGENT_GID:-20}"
    command: ["bun", "/reporter/agent-reporter.ts", "--home", "/opt/data", "--repo", "/work/open-autonomy", "--supercode", "/usr/local/bin/supercode"]
    environment:
      - OPEN_AUTONOMY_BASE_URL=http://sidecar:8787/v1
      - OPEN_AUTONOMY_KEY=sidecar
      - HOME=/tmp
    volumes:
      - ../platform/scripts/agent-reporter.ts:/reporter/agent-reporter.ts:ro
      - oa-home:/opt/data
      - oa-repo:/work/open-autonomy
    networks: [agent]
volumes:
  oa-home:
    name: oa-home
  oa-repo:
    name: oa-repo
networks:
  agent: {}
