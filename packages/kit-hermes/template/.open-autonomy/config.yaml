# The project's connection to Open Autonomy. Read by the reporter (.open-autonomy/reporter.ts) and the key
# tool (.open-autonomy/mint-key.ts). The kit seeds this file once; it is the project's own.
account: __ACCOUNT__
platform: https://open-autonomy.org

# Shared human roster, managed on the project's Team page after agent-led setup establishes the owner.
# JSON is a YAML value; keep this section in the SDK Team editor's JSON format. IDs are strings.
team: {"members": []}

# What the reporter publishes. Work sessions (the scheduled runs, the funded work) publish by default; the
# private exceptions are named here. Anything listed under `private` is never sent.
publish:
  runs: true        # sessions the schedule started (trigger: cron)
  chats: false      # conversations on a channel (Discord, a terminal)
  private:          # session ids or job names that never publish, whatever their kind
    - []

# Who publishes the timeline. Absent, or `hermes`: the reporter, from CHANGELOG.md, the board with its sessions,
# and ROADMAP.md. `none`: the project's own driver owns the timeline (an engagement whose work lives in a client's
# tracker), and the reporter publishes sessions, setup and documents only.
# timeline: hermes

# Where sessions come from: the Hermes home the reporter reads through supercode (HERMES_HOME in its
# environment), and where it keeps its own cursor (beside this file).
state_file: reporter-state.json

# The models the project's funds may buy on the platform's model rail: a bound the platform reads from this file and
# holds whatever a key was minted with. Empty: any model the gateway serves (`GET /v1/catalog` lists them).
models: [zai/glm-5.3-flash]

# The limits the project's funds run under on the platform's model rail, each over its own rolling window, all held at
# once, the call that would cross one refused with its name: the money (usd_cents), the pace (calls) or the volume
# (tokens, in and out), for everything or for one model (`model:`). Windows: 1m…60m, 1h…24h, 1d…31d. The kit's
# defaults: five dollars a day, sixty a month, and a pace no runaway loop keeps up.
spend:
  limits:
    - { window: 1d, usd_cents: 500 }
    - { window: 30d, usd_cents: 6000 }
    - { window: 1m, calls: 60 }

# The rails the agent may spend through beyond model calls, and the owner's bounds on each. Off unless a
# bound is set. Every rail leaves a record on the public audit trail naming itself.
rails:
  card:                       # a single-use virtual card minted against the balance (Stripe Issuing)
    max_usd_cents: 0          # the most one card may be minted for
    categories: []            # Stripe merchant categories a card may pay at, e.g. [computer_software_stores]
  partner:                    # a partner service settling a metered charge against the balance
    max_usd_cents: 0          # the most one charge may be
    partners: []              # the partner ids allowed to settle
