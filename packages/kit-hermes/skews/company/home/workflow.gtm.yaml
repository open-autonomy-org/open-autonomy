# Locked card/run IR: supercode docs/adr/0001-board-ir.md. Prompts live beside this file, under prompts/gtm/.
# The go-to-market lane's board (docs/decisions/0020): the product lane's card machine and statuses, unchanged. A card is
# a post or series, a demo or landing page, a funnel fix, a recurring round or an ask to strategy. A card's materials are
# a branch and pull request in the install's own repository, so the dispatcher starts its one review as it does an arc's;
# a reviewed post card waits, blocked by the manager on a message to its slot's live session, for the hand that posts it.
description: The go-to-market lane. Five card statuses, independent runs, one review before a post waits for its slot.
params:
  dispatch_interval_seconds: 60
  session_idle_quiet_seconds: 600
  claim_ttl_seconds: 900
  failure_limit: 2
  default_assignee: null
  # A review's session runs this profile, never the implementer's (RFC 0021 decision 5).
  reviewer_profile: reviewer
  max_in_progress: null
  max_spawn: null
  max_in_progress_per_profile: null
  session_grace_seconds: 120
  machine_offline_grace_seconds: 3600
  heartbeat_quiet_seconds: 1800
  block_age_seconds: 7200
  block_recurrence_limit: 2
  goal_max_turns: 20
  machines: {}
  create_dependencies_by: [manager, platform]
  review_only_by: []
  document_control_fields: [status, blocked_by, paused, archived, created_by, review_only]
  request_denial: unless there is no alternative or the user requested this - this request should be denied
  request_rules:
    block: 'Only the manager authorizes a block; name its dependency and explain why continued work is impossible.'
    pause: 'Only the manager pauses a card; a session that wants to pause asks the manager.'
    done: 'Only the session that created the card or the manager puts it in a terminal state. An arc still needs its one independent review, ticked Acceptance with evidence and closed tasks. Include the verdict and its artifact/screenshots and the exact PR head commit the reviewer ran. A post card is done only when every slot it was given is ticked with its live URL, or marked skipped or frozen.'
    cancelled: 'Only the session that created the card or the manager puts it in a terminal state. Cancellation is permanent; state why the work should end.'
  # The GTM manager's session address(es): the install's own (a board asks its manager here).
  managers: []
roles:
  implementer: card.assignee ?? card.arc.assignee ?? params.default_assignee
  reviewer: card.assignee ?? params.default_assignee
  auditor: card.assignee ?? params.default_assignee
  creator: card.created_by
initial: [{ guard: "event.review_only == true", target: review }, { target: todo }]
statuses:
  todo: { description: Work has not started. }
  running: { description: Work has started., run_role: implementer }
  review: { description: Awaiting an independent verdict., run_role: reviewer }
  done: { description: Accepted., stored_as: done }
  cancelled: { description: Permanently stopped., stored_as: archived }
derived:
  ready: "card.status == 'todo' && !card.dispatch_hold && card.blocked_by.size() == 0 && card.paused == null && !card.archived"
relations:
  blocked_by: { guard: "card.status in ['todo', 'running', 'review'] && !card.archived", completed: dependency_resolved, answered: dependency_resolved, cancelled: dependency_cancelled, aged: block_aged, age_seconds: params.block_age_seconds }
flags:
  paused: { clear_by: [manager] }
  archived: { when: ended }
stored_as:
  - { guard: "card.status == 'cancelled' || card.archived", status: archived }
  - { guard: "card.paused != null || card.blocked_by.exists(b, b.kind == 'message')", status: blocked }
  - { guard: card.ready, status: ready }
losses: [pause flag, done versus cancelled after archival, role prompts, machines panes and resume, supervision nudges, notice lists]
verbs:
  start:
    - from: [todo, running, review]
      by: [platform, manager]
      guard: "card.current_run_id == null && !card.dispatch_hold && card.subtask_of == null && card.blocked_by.size() == 0 && card.paused == null && !card.archived && (card.every == null || card.next_run_at == null || now >= card.next_run_at)"
      target: "{{card.status == 'todo' ? 'running' : card.status}}"
      actions: [{ claim: "{{card.status == 'review' ? 'reviewer' : 'implementer'}}" }]
  block:
    - from: [todo, running, review]
      by: [manager, platform]
      guard: "event.on != null || event.waiting_on != null"
      description: 'Only the manager blocks cards. Use request-state --state block --reason <why> --on <card> or --waiting-on <message>. Blocked by a card or a message: "<why>" --on <card> or --waiting-on <message>.'
      validate: [{ expr: "event.reason != null && event.reason != ''", message: A block must name what is missing. }]
      actions:
        - relation: { add: "{{event.on ?? event.waiting_on}}", reason: "{{event.reason}}" }
        - wait_run: true
        - count: block_recurrences
        - record: { kind: "{{card.counters.block_recurrences >= params.block_recurrence_limit ? 'recurring_block' : 'blocked'}}" }
    # A draft (RFC 0020 decision 14): its creator files it blocked by its own message to the manager, before it has
    # ever run; the manager's reply to that message ends the block (blocked_by: answered).
    - from: [todo]
      by: [creator]
      guard: "event.waiting_on != null && event.on == null && card.current_run_id == null && card.dispatch_hold"
      description: 'A draft: block your own held card (created with --no-start) on your message to the manager: block <card> "<why>" --waiting-on <message>.'
      validate: [{ expr: "event.reason != null && event.reason != ''", message: A block must name what is missing. }]
      actions:
        - relation: { add: "{{event.waiting_on}}", reason: "{{event.reason}}" }
        - record: blocked
  unblock:
    - from: [todo, running, review]
      by: [implementer, reviewer, arc, manager, platform, hermes]
      description: 'What arrived: --reason "<evidence>" [--on <one blocker>].'
      validate: [{ expr: "event.reason != null && event.reason != ''", message: Unblock must say what arrived. }]
      actions:
        - relation: { remove: "{{event.hermes ? 'messages' : (event.on ?? '*')}}", reason: "{{event.reason}}" }
        - wait_run: "{{card.blocked_by.size() > 0}}"
        - reset: [failures]
        - every: "{{card.every}}"
        - record: unblocked
    # Hermes unblock also clears a lowered pause, through the declared compatibility event below.
  hermes_unpause:
    - by: [manager]
      actions: [{ flag: { name: paused, value: false } }, { reset: [failures] }, { every: "{{card.every}}" }, { record: resumed }]
  dependency_resolved:
    # A draft (RFC 0020 decision 14): the manager's reply to its own message ends the block and the dispatch hold, so
    # the card becomes ready, or starts where the manager sequences it.
    - by: [platform]
      guard: "card.dispatch_hold && card.current_run_id == null && card.blocked_by.size() == 1 && card.blocked_by.exists(b, b.kind == 'message')"
      actions: [{ relation: { remove: "{{event.on}}", reason: "{{event.reason}}" } }, { reset: [failures] }, { record: unblocked }, { record: dispatch_released }]
    - by: [platform]
      actions: [{ relation: { remove: "{{event.on}}", reason: "{{event.reason}}" } }, { wait_run: "{{card.blocked_by.size() > 0}}" }, { reset: [failures] }, { every: "{{card.every}}" }, { record: unblocked }]
  dependency_cancelled:
    - by: [platform]
      actions:
        - relation: { remove: "{{event.on}}", reason: "{{event.reason}}" }
        - ask: { to: "{{params.managers[0]}}", text: "{{card.id}} was blocked by {{event.on}}, which was cancelled. What replaces it?" }
        - relation: { add: "{{asked}}", reason: "blocking card cancelled" }
        - wait_run: true
        - record: dependency_cancelled
  block_aged:
    - by: [platform]
      actions: [{ record: { kind: block_aged, payload: { on: "{{event.on}}", reason: "{{event.reason}}" } } }]
  replace_session:
    - from: [todo, running, review]
      by: [manager, owner]
      description: 'Explicitly let go of an unusable session: --reason "<why>".'
      validate: [{ expr: "event.reason != null && event.reason != ''", message: Session replacement needs a reason. }]
      actions:
        - close_session: "{{before.status == 'review' ? 'reviewer' : (card.every != null ? 'auditor' : 'worker')}}"
        - end_run: { outcome: reclaimed }
        - forget_session: "{{before.status == 'review' ? 'reviewer' : (card.every != null ? 'auditor' : 'worker')}}"
        - reset: [failures]
        - every: "{{card.every}}"
        - record: session_forgotten
  reclaim:
    - from: [todo, running, review]
      by: [manager, platform, owner]
      description: End the current run so its lane can be reassigned.
      actions:
        - close_session: "{{before.status == 'review' ? 'reviewer' : (card.every != null ? 'auditor' : 'worker')}}"
        - end_run: { outcome: reclaimed }
        - reset: [failures]
        - every: "{{card.every}}"
        - record: reclaimed
  pause:
    - from: [todo, running, review]
      by: [manager]
      description: 'Only the manager pauses cards. Use request-state --state pause --reason <why> --waiting-on <message>.'
      actions:
        - flag: { name: paused, value: true, reason: "{{event.reason}}" }
        - close_session: "{{before.status == 'review' ? 'reviewer' : (card.every != null ? 'auditor' : 'worker')}}"
        - end_run: { outcome: paused }
        - record: paused
  resume:
    - from: [todo, running, review]
      by: [manager]
      description: Only the manager resumes a paused card; ask the manager with your reason.
      actions: [{ flag: { name: paused, value: false } }, { reset: [failures] }, { every: "{{card.every}}" }, { record: resumed }]
  request_state:
    - by: [implementer, reviewer, auditor, arc, creator, hermes, manager]
      description: 'Ask the manager: --state block|pause|done|cancelled --reason "<why>" [--on <card>|--waiting-on <message>] [--evidence "<verdict and pointers>"]. This leaves the card and run active.'
      validate:
        - { expr: "event.state in ['block', 'pause', 'done', 'cancelled'] && event.reason != null && event.reason != ''", message: Name the requested state and reason. }
        - { expr: "event.state != 'block' || event.on != null || event.waiting_on != null", message: A block request names the card or message it waits on. }
        - { expr: "!(event.state in ['done', 'cancelled']) || (event.evidence != null && event.evidence != '')", message: A terminal request includes its evidence; for done include the independent verdict and artifacts. }
      actions:
        - ask:
            to: "{{params.managers[0]}}"
            text: |
              Request {{event.state}} for {{card.id}}: {{card.title}}
              Requester: {{requester}}; recorded creator: {{card.creator_address ?? 'unknown (manager decides)'}}
              Reason: {{event.reason}}
              Waiting on: {{event.on ?? event.waiting_on ?? 'none named'}}
              Deployment: {{card.ci.repository ?? 'no repository'}}@{{card.ci.commit ?? 'no code commit'}}; CI {{card.ci.workflow ?? 'missing'}} #{{card.ci.run_id ?? 'missing'}} {{card.ci.status ?? ''}}/{{card.ci.conclusion ?? ''}} {{card.ci.url ?? ''}}
              Reviewed PR head: {{event.reviewed_sha ?? event.commit ?? event.deployed_sha ?? 'not supplied'}}
              Additional deployed artifacts: {{card.ci.coverage ?? []}}
              Evidence: {{event.evidence ?? 'none supplied'}}
              Rules: {{params.request_rules[event.state]}}
              {{params.request_denial}}
        - record: { kind: "{{event.state == 'done' && 'reviewer' in sender ? 'review_pass' : 'state_requested'}}", payload: { state: "{{event.state}}", reason: "{{event.reason}}", evidence: "{{event.evidence}}", requester: "{{requester}}", ci: "{{event.ci}}", deployed_sha: "{{event.deployed_sha}}", reviewed_sha: "{{event.reviewed_sha}}" } }
  request_review:
    - from: [running]
      by: [platform]
      description: 'Only the board starts a review: once every task on the arc is closed and its PR is open at its pushed head, the dispatcher requests the one review. No session or manager requests one.'
      validate:
        - { expr: "card.subtask_of == null && card.every == null", message: Only an arc card requests review. }
        - { expr: "!card.review_only", message: A review-only card records its verdict with request-state done; it does not request another review. }
        - { expr: "card.paused == null && card.blocked_by.size() == 0", message: Resume or unblock the card before requesting review. }
        - { expr: "card.subtasks.all(t, t.status in ['done', 'cancelled'])", message: Close or drop each subtask before review. }
      target: review
      actions:
        - end_run: { outcome: review_requested }
        - assign: { field: assignee, value: "{{event.reviewer ?? params.reviewer_profile}}" }
        - record: review_requested
  request_changes:
    - from: [review]
      by: [reviewer]
      validate: [{ expr: "!card.review_only", message: A review-only card reports its pass or failure verdict with request-state done; file findings on the implementation arc. }]
      description: 'Return the card for fixes: "<what must change>".'
      target: running
      actions:
        - close_session: reviewer
        - end_run: { outcome: changes_requested }
        - assign: { field: assignee, value: "{{card.implementer}}" }
        - record: changes_requested
  complete:
    - from: [todo, running, review]
      by: [arc, implementer, reviewer]
      guard: card.subtask_of != null
      description: 'A subtask is closed by the sessions working its arc; only a whole arc comes to the manager: --result "<what was done>".'
      target: done
      actions: [{ set_result: "{{event}}" }, { record: completed }]
    - from: [running]
      by: [auditor, platform]
      guard: card.every != null
      description: 'Finish this recurring round: --summary "<what was observed>".'
      actions: [{ end_run: { outcome: completed } }, { record: audited }]
    - from: [todo, running, review]
      by: [creator, manager]
      validate:
        - { expr: "card.subtask_of != null || card.status == 'review'", message: An arc completes only from review with its independent verdict supplied to the creator or manager. }
        - { expr: "card.subtask_of != null || (card.last_events.review_pass != null && (card.review_only ? (card.latest_review.address != null && card.latest_review.address != card.creator_address && card.last_events.review_pass.payload.requester == card.latest_review.address && card.last_events.review_pass.created_at >= card.latest_review.started_at && card.last_events.review_pass.created_at >= (card.last_events.review_mode_changed.created_at ?? card.created_at)) : (card.last_events.review_requested != null && card.last_events.review_pass.created_at >= card.last_events.review_requested.created_at)))", message: An independent reviewer must record its current verdict before the creator or manager accepts the arc; implementation arcs require their review request. }
        - { expr: "card.acceptance_complete()", message: Tick every Acceptance outcome with a pointer. }
        - { expr: "card.subtasks.all(t, t.status in ['done', 'cancelled'])", message: Every subtask must be closed or dropped. }
        - { expr: "card.last_commit_at() == null || card.last_events.review_requested == null || card.last_commit_at() <= card.last_events.review_requested.created_at", message: A newer commit requires a new review request. }
        - { expr: "card.blocked_by.size() == 0 && card.paused == null", message: A blocked or paused card cannot complete. }
      target: done
      actions:
        - close_session: reviewer
        - end_run: { outcome: completed }
        - set_result: "{{event}}"
        - reset: [failures, block_recurrences]
        - record: completed
  cancel:
    - from: [todo, running, review]
      by: [arc, implementer, reviewer]
      guard: card.subtask_of != null
      target: cancelled
      actions: [{ record: cancelled }]
    - from: [todo, running, review]
      by: [manager, creator]
      target: cancelled
      actions:
        - close_session: "{{before.status == 'review' ? 'reviewer' : (card.every != null ? 'auditor' : 'worker')}}"
        - end_run: { outcome: cancelled }
        - flag: { name: archived, value: true }
        - record: cancelled
  archive:
    - from: [done, cancelled]
      by: [manager, creator]
      actions: [{ flag: { name: archived, value: true } }, { record: archived }]
    - from: [todo, running, review]
      by: [manager, creator]
      actions: [{ card_event: { name: cancel, as: "{{sender}}" } }]
  reopen:
    - from: [done, cancelled]
      by: [manager, owner, arc]
      target: todo
      actions: [{ flag: { name: archived, value: false } }, { record: reopened }]
  comment: [{ by: [implementer, reviewer, auditor, arc, manager, owner], actions: [{ record: commented }] }]
  assign:
    - by: [manager, owner]
      validate: [{ expr: card.current_run_id == null, message: End the current run before assigning another lane. }]
      actions:
        - forget_session: { slot: "{{card.status == 'review' ? 'reviewer' : (card.every != null ? 'auditor' : 'worker')}}", assignee: "{{event.assignee}}" }
        - assign: { field: assignee, value: "{{event.assignee}}" }
        - reset: [failures]
        - record: assigned
  move:
    - by: [manager, owner]
      guard: event.machine != card.machine
      validate: [{ expr: card.current_run_id == null, message: End the current run before moving its card. }]
      actions: [{ forget_session: '*' }, { assign: { field: machine, value: "{{event.machine}}" } }, { reset: [failures] }, { record: machine_set }]
    - by: [manager, owner]
      actions: [{ record: machine_set }]
  link: [{ by: [manager], actions: [{ relation: { add: "{{event.parent}}" } }, { wait_run: true }, { record: linked }] }]
  unlink: [{ by: [manager, owner, arc], actions: [{ relation: { remove: "{{event.parent}}", reason: "dependency removed by manager" } }, { wait_run: "{{card.blocked_by.size() > 0}}" }, { record: unlinked }] }]
  specify:
    - by: [implementer, reviewer, auditor, arc, manager, owner]
      validate:
        - { expr: "('manager' in sender || 'owner' in sender) || (event.workspace == null && ('arc' in sender || card.only_ticks(event.body)))", message: A card's session may tick Acceptance; its manager owns changes to scope. }
        - { expr: "event.review_only == null || sender.exists(role, role in params.review_only_by)", message: Only the manager declares a review-only card. }
      target: "{{event.review_only == true ? 'review' : (event.review_only == false && card.review_only ? 'todo' : card.status)}}"
      actions: [{ specify: "{{event}}" }, { record: specified }]
  set_every: [{ by: [manager, owner], actions: [{ every: "{{event.every}}" }, { record: recurrence_changed }] }]
run:
  initial: active
  recurring_role: auditor
  roles:
    implementer: { role: implementer, session: worker, prompt_file: prompts/gtm/implementer.md }
    reviewer: { role: reviewer, session: reviewer, prompt_file: prompts/gtm/reviewer.md }
    auditor: { role: auditor, session: auditor, prompt_file: prompts/gtm/auditor.md }
  limits: { runtime: card.max_runtime_seconds, grace: params.session_grace_seconds }
  states: { active: {}, waiting_machine: {}, failed: {}, blocked: {}, completed: {} }
  on:
    heartbeat:
      - by: [implementer, reviewer, auditor]
        description: 'Still working or waiting: --note "<what>" [--until <time|2h>].'
        actions: [{ extend_claim: null }, { reset: [goal_turns] }, { record: heartbeat }]
    session_idle:
      - by: [platform]
        guard: "card.last_heartbeat_at != null && now < (card.last_events.heartbeat.payload.until ?? card.last_heartbeat_at + params.heartbeat_quiet_seconds)"
      - by: [platform]
        guard: "event.turns >= (card.goal_max_turns ?? params.goal_max_turns)"
        target: blocked
        actions: [{ end_run: { outcome: blocked } }]
      - by: [platform]
        actions: [{ count: goal_turns }, { send_to_actor: "Work reminder: {{card.title}} ({{card.id}}). Continue, or record the outcome. Read the card and its available actions: supercode workflow show {{card.id}} {{where}}" }, { record: decision_asked }]
    spawn_failed: [{ by: [platform], target: failed, actions: [{ end_run: { outcome: spawn_failed } }, { count: failures }] }]
    # A session here never completes its own card (only its creator or the manager does), so one that ends cleanly
    # has finished its run: the completed outcome starts the arc's review or asks the manager. Only a failed end crashes.
    exited:
      - { by: [platform], guard: "event.code == 0", target: completed, actions: [{ end_run: { outcome: completed } }] }
      - { by: [platform], target: failed, actions: [{ end_run: { outcome: crashed } }, { count: failures }] }
    session_closed: [{ by: [platform], target: completed, actions: [{ end_run: { outcome: completed } }] }]
    timed_out: [{ by: [platform], target: failed, actions: [{ stop_run: null }, { end_run: { outcome: timed_out } }, { count: failures }] }]
    orphaned: [{ by: [platform], target: failed, actions: [{ end_run: { outcome: reclaimed } }, { count: failures }] }]
    session_lost: [{ by: [platform], target: failed, actions: [{ end_run: { outcome: reclaimed } }, { count: failures }] }]
    machine_offline: [{ by: [platform], guard: "run.state != 'waiting_machine'", target: waiting_machine, actions: [{ record: machine_wait }] }]
    machine_online: [{ by: [platform], from: [waiting_machine], target: active, actions: [{ record: machine_returned }] }]
    machine_wait_aged:
      - by: [platform]
        from: [waiting_machine]
        actions:
          - card_event: { name: block_aged, payload: { reason: "{{event.reason}}", on: "{{event.machine}}" } }
    finished: [{ by: [platform], target: completed, actions: [{ end_run: { outcome: completed } }] }]
  outcomes:
    failed:
      - guard: card.counters.failures >= (card.max_retries ?? params.failure_limit)
        actions:
          - ask: { to: "{{params.managers[0]}}", text: "{{card.id}} reached its failure limit: {{event.error}}. What should happen next?" }
          - relation: { add: "{{asked}}", reason: "failure limit reached" }
          - record: gave_up
    blocked:
      - actions:
          - ask: { to: "{{params.managers[0]}}", text: "{{card.id}} cannot continue its run: {{event.error ?? 'its session stopped deciding'}}. What unblocks it?" }
          - relation: { add: "{{asked}}", reason: "run needs a decision" }
          - record: blocked
    completed:
      - guard: card.every != null
        actions: [{ card_event: { name: complete, as: [platform] } }]
      # an arc whose session finished waits for the dispatcher, which starts its one review once its PR is open
      - guard: "card.status == 'running' && card.subtask_of == null"
        actions: []
      # a reviewer that recorded its verdict in this run has already mailed it to the manager
      - guard: "card.last_events.review_pass != null && card.last_run.started_at != null && card.last_events.review_pass.created_at >= card.last_run.started_at"
        actions: []
      - actions: [{ ask: { to: "{{params.managers[0]}}", text: "{{card.id}} ended its run without a terminal verdict request. Obtain the recorded review before accepting it. {{params.request_rules.done}} {{params.request_denial}}" } }]
dispatch:
  tick: params.dispatch_interval_seconds
  start: start
  # a reviewed arc (its verdict after its review request) waits for its creator or the manager, not another review
  eligible: "card.subtask_of == null && !card.dispatch_hold && card.current_run_id == null && !(card.status == 'review' && card.last_events.review_pass != null && card.last_events.review_requested != null && card.last_events.review_pass.created_at >= card.last_events.review_requested.created_at) && card.blocked_by.size() == 0 && card.paused == null && !card.archived && !(run.local && (host.memory_pressure == 'critical' || (host.memory_pressure == 'elevated' && tick.local_started >= 1)))"
  order: ["card.status == 'review' ? 0 : 1", '-card.priority', card.created_at]
  capacity:
    - { name: the home's cards, scope: global, counts: runs, max: "params.max_in_progress ?? host.max_in_progress", reserve: { for: { status: review }, slots: 1 } }
    - { name: the board's cards, scope: board, counts: runs, max: params.max_spawn }
    - { name: the profile's cards, scope: profile, counts: runs, max: "lane.capacity ?? params.max_in_progress_per_profile" }
    - { name: the machine's started cards, scope: machine, counts: cards, where: { status: [running, review] }, max: "params.machines[card.machine].capacity" }
notify:
  manager:
    recurring_block: "{{card.id}} blocked again: {{event.reason}}"
    block_aged: "{{card.id}} still waits on {{event.on}}: {{event.reason}}"
    completed: "{{card.subtask_of == null ? 'Arc ' + card.id + ' accepted: ' + card.title : ''}}"
  creator:
    completed: "{{card.subtask_of == null ? 'Arc ' + card.id + ' accepted: ' + card.title : ''}}"
    audited: "Audit round on {{card.id}}: {{event.summary}}"
  worker:
    run_changed: "{{card.id}}: {{event.verb}} changed run {{run.id}} ({{event.from}} → {{event.to}}). {{card.blocked_by.size() > 0 ? 'Keep this session open and idle until its named dependencies clear.' : 'Follow the board state before continuing.'}} {{event.reason ?? ''}}"
    commented: "{{card.id}}, {{event.author}}:\n{{comment.body}}"
