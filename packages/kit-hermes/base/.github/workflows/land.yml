name: Land a branch
# Pushing opens the PR. The board independently reviews its exact head;
# after a pass the author merges that head. A changed head requires a new review.
#   agent/**  the agent's own work        land/**  a maintainer's
on:
  push:
    branches: ['agent/**', 'land/**']
permissions:
  contents: write
  pull-requests: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Open the pull request once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create -R "$REPO" --base main --head "$BRANCH" --title "$BRANCH" \
              --body "Opened by the landing workflow for \`$BRANCH\`. The board independently reviews the exact head; after a pass, the author merges that head. A changed head requires a new review."
          fi
