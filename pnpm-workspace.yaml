# A failed hard link must refuse rather than duplicate a package on this volume.
nodeLinker: hoisted
packageImportMethod: hardlink
shamefullyHoist: true
enablePrePostScripts: true
autoInstallPeers: false
strictPeerDependencies: false
linkWorkspacePackages: true
preferWorkspacePackages: true
overrides:
  undici: ^7.29.0
  sharp: 0.35.5
  source-map-js: 1.2.2
  '@volter/supercode-harness-sdk': workspace:0.3.64
