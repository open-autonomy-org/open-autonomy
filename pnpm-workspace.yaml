  '@volter/supercode-terminal': workspace:0.2.30
  '@volter/teams': workspace:0.2.18
  '@volter/identity': workspace:0.1.0
  '@volter/ztrack': workspace:2.5.0
  '@volter/world-runtime': workspace:2.0.8
  '@volter/world-access': workspace:2.0.1
  '@volter/world-ui': workspace:0.1.6
  '@volter/world-tooling': workspace:0.1.0
  '@volter/twin-discord': workspace:2.0.5
  '@volter/twin-openai': workspace:2.0.5
  '@volter/twin-npm-registry': workspace:2.0.5
