packages:
  - apps/*
  - packages/*
# A failed hard link must refuse rather than duplicate a package on this volume.
nodeLinker: hoisted
packageImportMethod: hardlink
shamefullyHoist: true
enablePrePostScripts: true
autoInstallPeers: false
strictPeerDependencies: false
overrides:
  undici: ^7.29.0
  sharp: 0.35.5
  source-map-js: 1.2.2
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
