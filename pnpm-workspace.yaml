  '@volter/twin-discord>@volter/world-ui': workspace:0.1.5
  '@volter/twin-openai>@volter/world-ui': workspace:0.1.5
  '@volter/twin-stripe>@volter/world-ui': workspace:0.1.5
allowBuilds:
  '@homebridge/node-pty-prebuilt-multiarch': true
  esbuild: true
  sharp: true
  workerd: true
