name: Security
# Scans the workflows (zizmor) and every lockfile (integrity + audit) on push, weekly, and on demand.
on:
  push:
    branches: [main, 'agent/**', 'land/**']
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Supply-chain (lockfile integrity + bun audit)
        run: bun scripts/check-supply-chain.ts
      - name: Workflow static analysis (zizmor)
        run: pipx run zizmor==1.26.1 --offline --min-severity high .github/workflows/
