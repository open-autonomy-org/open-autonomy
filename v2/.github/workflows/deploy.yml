name: Deploy platform
# Production deploy of the platform worker (apps/platform).
#  - Fires ONLY on a human-cut `deploy-v*` tag (agents cannot push tags) or a manual dispatch; either way the
#    `production` environment's required reviewer approves each deployment.
#  - Egress is locked to npm + Cloudflare, so the scoped deploy token cannot leave to any other host. The
#    token is scoped to Workers-edit on this one worker.
#  - The books live in the worker's Durable Object and survive the deploy; keys verify by signature and
#    expiry and survive it too (apps/platform/DEPLOY.md).
on:
  push:
    tags: ['deploy-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Lock down egress (the scoped deploy token must not leave to a non-Cloudflare host)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            api.cloudflare.com:443
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
          no-cache: true # no restored cache can poison a privileged deploy
      - name: Install (frozen)
        run: bun install --frozen-lockfile
      - name: Deploy (the lockfile-pinned wrangler)
        working-directory: apps/platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: bun run deploy
