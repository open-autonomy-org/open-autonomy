name = "volter-agent-model-proxy"
main = "src/index.ts"
compatibility_date = "2026-06-15"

# The worker keeps its default *.workers.dev URL live; open-autonomy.org is attached as a custom domain in
# the Cloudflare dashboard. The name is the deployed worker's: keeping it keeps the Durable Object storage
# (the books) across deploys.
workers_dev = true

[vars]
MODEL_GATEWAY_URL = "https://api-gateway.merge.dev"
MAX_BODY_BYTES = "1048576"
MODEL_PRICES_JSON = "{}"
# The global daily rail: a runaway-safety cap on the platform's total settled spend per UTC day, independent
# of any account's balance. The admin reset hatch clears it without waiting for midnight.
MAX_GLOBAL_DAILY_USD_CENTS = "5000"
DEFAULT_FUNDING_ACCOUNT = "open-autonomy-org/open-autonomy"
DEFAULT_SPONSOR_ACCOUNT = "open-autonomy-org/open-autonomy"

# Monthly sponsorship accrual (credits active recurring sponsors; idempotent per month) and the docs sync.
[triggers]
crons = ["0 6 1 * *"]

# One Durable Object: the books. The class name and binding are the deployed worker's, so the state carries
# over. Secrets (never in this file): AGENT_PROXY_ADMIN_TOKEN, AGENT_PROXY_HMAC_SECRET, MODEL_GATEWAY_API_KEY,
# GITHUB_SPONSORS_WEBHOOK_SECRET, GITHUB_TOKEN.
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "LimitLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunBudget", "LimitLedger"]

[[migrations]]
tag = "v2"
deleted_classes = ["RunBudget"]
