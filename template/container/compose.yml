# A project's Open Autonomy agent, as it runs: two containers in one VM.
#   agent    stock Hermes (gateway = the Discord channel + the cron schedule) with the project checkout it works
#   sidecar  holds the project's standing key: forwards the model routes, and turns Hermes's own lifecycle
#            events into the platform's receipts
# Nothing the agent can read is a secret that matters (template/README.md). The home and the checkout live
# in Docker volumes: SQLite over a host bind mount is a bus error waiting to happen, and nothing on the
# host needs them — inspect with `docker exec`.
#
#   AGENT_SECRETS=~/.config/open-autonomy docker compose -f template/container/compose.yml up -d --build
services:
  sidecar:
    build:
      context: ../..
      dockerfile: template/container/Dockerfile.sidecar
    image: open-autonomy-sidecar:local
    container_name: oa-sidecar
    restart: unless-stopped
    environment:
      - AGENT_ENV_FILE=/secrets/agent.env
    volumes:
      - ${AGENT_SECRETS:-~/.config/open-autonomy}/agent.env:/secrets/agent.env:ro
    networks: [agent]
  # The committed home (SOUL, skills, config, the schedule seed) into the volume before the gateway starts:
  # `hermes/` in the repository is the source of truth for what the agent IS, and the volume only holds what
  # the agent has since done. Without this a change to config.yaml or a skill would sit in git while the
  # container kept running the copy it was seeded with.
  home-sync:
    image: alpine:3
    container_name: oa-home-sync
    restart: "no"
    command: ["sh", "-c", "cd /repo/hermes && find . -type f ! -name '.env' -exec cp -a --parents {} /opt/data/ \\; && chown -R ${AGENT_UID:-501}:${AGENT_GID:-20} /opt/data && echo 'home synced from the repository'"]
    volumes:
      - oa-home:/opt/data
      - oa-repo:/repo:ro
  agent:
    build:
      context: ../..
      dockerfile: template/container/Dockerfile
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-hermes-agent:v2026.8.31} # template/container/build-hermes.sh builds it
    image: open-autonomy-agent:local
    container_name: oa-agent
    restart: unless-stopped
    depends_on:
      sidecar: { condition: service_started }
      home-sync: { condition: service_completed_successfully }
    command: ["gateway", "run"]
    environment:
      # The host user's ids: the forwarded ssh-agent socket is theirs.
      - HERMES_UID=${AGENT_UID:-501}
      - HERMES_GID=${AGENT_GID:-20}
      - SSH_AUTH_SOCK=/ssh-agent
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=accept-new
      - TWINS_ROOT=/opt/twin
      # Hermes pushes its lifecycle events here; the sidecar turns them into the platform's receipts.
      - OPEN_AUTONOMY_NARRATE_URL=http://sidecar:8787/hermes-hook
    volumes:
      - oa-home:/opt/data
      - oa-repo:/work/project
      - /run/host-services/ssh-auth.sock:/ssh-agent
      # The twins checkout, read-only, for a project whose AGENTS.md verifies in a volter-world (this one
      # does). Needed until the twin packages are published. Nothing in it is a credential.
      - ${TWINS_ROOT:-~/volter/twin}:/opt/twin:ro
    networks: [agent]
volumes:
  oa-home:
    name: oa-home
    external: true # seeded once from hermes/ (hermes/README.md)
  oa-repo:
    name: oa-repo
    external: true # the agent's clone
networks:
  agent: {}
